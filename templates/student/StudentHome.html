<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home</title>
</head>

<body style="
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);
    font-family:Segoe UI,Arial,sans-serif;
">

    <div style="
        background:#ffffff;
        padding:35px 45px;
        border-radius:14px;
        width:320px;
        box-shadow:0 15px 35px rgba(0,0,0,0.25);
        text-align:center;
    ">
        <h1 style="
            margin-bottom:25px;
            color:#333;
            font-size:26px;
            letter-spacing:1px;
        ">
            Student Home
        </h1>

        <p style="
            font-size:17px;
            color:#555;
            margin:12px 0;
        ">
            Name : <span style="color:#111;font-weight:600;">{{ Name }}</span>
        </p>

        <p style="
            font-size:17px;
            color:#555;
            margin:12px 0;                                   
        ">
            Age : <span style="color:#111;font-weight:600;">{{ Age }}</span>
        </p>

        <p style="
            font-size:17px;
            color:#555;
            margin:12px 0;
        ">
            City : <span style="color:#111;font-weight:600;">{{ City }}</span>
        </p>
    </div>

</body>
</html>
