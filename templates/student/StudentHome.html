<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home</title>
</head>

<body style="
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f2f4f8;
    font-family:Arial, Helvetica, sans-serif;
">

    <div style="
        background:#ffffff;
        padding:30px 40px;
        border-radius:8px;
        width:340px;
        border:1px solid #e0e0e0;
        box-shadow:0 8px 20px rgba(0,0,0,0.08);
    ">

        <h1 style="
            margin:0 0 20px 0;
            text-align:center;
            font-size:24px;
            color:#2c3e50;
            border-bottom:2px solid #3498db;
            padding-bottom:10px;
        ">
            Student Home
        </h1>

        <p style="
            font-size:16px;
            color:#444;
            margin:14px 0;
            display:flex;
            justify-content:space-between;
        ">
            <strong>Name</strong>
            <span>{{ name }}</span>
        </p>

        <p style="
            font-size:16px;
            color:#444;
            margin:14px 0;
            display:flex;
            justify-content:space-between;
        ">
            <strong>Age</strong>
            <span>{{ age }}</span>
        </p>

        <p style="
            font-size:16px;
            color:#444;
            margin:14px 0;
            display:flex;
            justify-content:space-between;
        ">
            <strong>City</strong>
            <span>{{ city }}</span>
        </p>

    </div>

</body>
</html>
