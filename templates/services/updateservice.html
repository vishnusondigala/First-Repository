<body style="
    font-family:Segoe UI, sans-serif;
    background:linear-gradient(to right, #eef2f7, #e3e9f2);
    margin:0;
    padding:60px 0;">

<div style="
    width:420px;
    margin:auto;
    background:#ffffff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    border-top:6px solid #2c3e50;">

    <h1 style="
        text-align:center;
        color:#2c3e50;
        font-size:30px;
        margin-bottom:25px;">
        Update Service
    </h1>

    <form method="post">
        {% csrf_token %}

        <div style="
            margin-bottom:20px;
            font-size:15px;">
            {{ form.as_p }}
        </div>

        <input type="submit" value="Update"
               style="
               width:100%;
               padding:12px;
               background:#2c3e50;
               color:white;
               border:none;
               border-radius:6px;
               font-size:16px;
               font-weight:500;
               cursor:pointer;">
    </form>

</div>

</body>
