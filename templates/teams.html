<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul style="list-style:none; padding:0; max-width:420px; margin:auto; font-family:Arial, sans-serif;">
    {% for teams in teams %}
    <li style="
        background:#ffffff;
        margin:14px 0;
        padding:16px;
        border-radius:14px;
        box-shadow:0 8px 18px rgba(0,0,0,0.12);
        transition:0.3s;
    ">
        <strong style="font-size:20px; color:#2c3e50;">
            {{ teams.name }}
        </strong><br>

        <span style="display:block; margin:6px 0; color:#555;">
            🏆 Trophy: {{ teams.trophy }}
        </span>

        {% if teams.trophy > 4 %}
            <span style="
                background:#2ecc71;
                color:white;
                padding:6px 14px;
                border-radius:20px;
                font-size:14px;
                font-weight:bold;
            ">
                Strong Team
            </span>

        {% elif teams.trophy >= 1 and teams.trophy <= 3 %}
            <span style="
                background:#f39c12;
                color:white;
                padding:6px 14px;
                border-radius:20px;
                font-size:14px;
                font-weight:bold;
            ">
                Average Team
            </span>

        {% else %}
            <span style="
                background:#e74c3c;
                color:white;
                padding:6px 14px;
                border-radius:20px;
                font-size:14px;
                font-weight:bold;
            ">
                Weak Team
            </span>
        {% endif %}
    </li>
    {% endfor %}
</ul>

    
</body>
</html>
